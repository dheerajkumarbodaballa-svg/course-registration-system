services:
  # Node.js Web Service
  - type: web
    name: course-registration-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: course-registration-db
          property: connectionString

databases:
  # Free managed PostgreSQL database
  - name: course-registration-db
    plan: free
    databaseName: course_registration
    user: crs_user
